[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplannet"
version = "1.0.0"
description = "Architectural floor plan parsing: DeepLabV3 segmentation of rooms, walls and openings + OpenCV vectorisation to editable geometry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FloorPlanNet contributors" }]
dependencies = [
  "numpy>=1.24", "opencv-python-headless>=4.8", "scipy>=1.10", "scikit-image>=0.21",
  "pyyaml>=6.0", "onnxruntime>=1.17", "ezdxf>=1.1",
]
keywords = ["floor plan", "segmentation", "deeplabv3", "vectorization", "cubicasa5k", "pytorch"]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "timm>=0.9", "onnx>=1.15"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
floorplannet = "floorplannet.cli:main"

[tool.setuptools.packages.find]
include = ["floorplannet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905"]
